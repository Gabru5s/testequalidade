name: CI Pipeline
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─── 1. BUILD ───────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ProjetoQA
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Build project
        run: ./mvnw clean compile -q

      - name: Upload target
        uses: actions/upload-artifact@v4
        with:
          name: build-target
          path: ProjetoQA/target/

  # ─── 2. TESTS ───────────────────────────────────────────────
  tests:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ProjetoQA
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ✅ chmod precisa repetir em cada job que usa o mvnw
      - name: Grant execute permission to Maven Wrapper
        run: chmod +x ProjetoQA/mvnw

      - name: Download build target
        uses: actions/download-artifact@v4
        with:
          name: build-target
          path: ProjetoQA/target/

      - name: Run tests with coverage and verify threshold
        run: ./mvnw test jacoco:report -Pcoverage-check -q

      - name: Generate test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          # ✅ caminho relativo à raiz do repo, não ao working-directory
          path: ProjetoQA/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: ProjetoQA/target/site/jacoco/

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let coverage = 'N/A';
            try {
              const jacocoReport = fs.readFileSync(
                'ProjetoQA/target/site/jacoco/index.html',
                'utf8'
              );
              const coverageMatch =
                jacocoReport.match(/Total.*?<td.*?>(\d+%)<\/td>/);
              coverage = coverageMatch ? coverageMatch[1] : 'N/A';
            } catch (e) {
              console.log('Coverage report not found.');
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body:
                `📊 **Code Coverage Report**\n\n` +
                `Total Coverage: ${coverage}\n\n` +
                `✅ Tests executed successfully\n\n` +
                `View detailed report in artifacts.`
            });

  # ─── 3. INTEGRATION ─────────────────────────────────────────
  integration:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ProjetoQA
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x ProjetoQA/mvnw

      - name: Download build target
        uses: actions/download-artifact@v4
        with:
          name: build-target
          path: ProjetoQA/target/

      - name: Upload coverage to SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.projectKey=Bloodborne2_ProjetoQA \
            -Dsonar.organization=bloodborne2 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -q
