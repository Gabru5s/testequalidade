<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Meus Livros</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ccc;
            padding-bottom: 15px;
        }
        .livro-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .livro-info h3 {
            margin: 0;
        }
        .livro-info p {
            margin: 5px 0;
            color: #666;
        }
        .botoes {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-editar {
            background-color: #2196F3;
            color: white;
        }
        .btn-deletar {
            background-color: #f44336;
            color: white;
        }
        .btn-novo {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            display: inline-block;
            border-radius: 4px;
        }
        .btn-logout {
            background-color: #ff9800;
            color: white;
            padding: 8px 15px;
        }
        .lista-vazia {
            text-align: center;
            color: #999;
            padding: 40px;
        }
    </style>
</head>
<body>
<div class="header">
    <h1>Meus Livros</h1>
    <form method="post" action="/logout" style="margin: 0;">
        <button type="submit" class="btn-logout">Logout</button>
    </form>
</div>

<a href="/livros/novo" class="btn-novo">+ Novo Livro</a>

<div id="lista"></div>

<script>
    const usuarioId = "[[${usuarioId}]]";
    
    console.log("usuarioId:", usuarioId);
    
    fetch("/api/livros", {
        headers: {
            "X-Usuario-Id": usuarioId
        }
    })
        .then(res => res.json())
        .then(data => {
            console.log("Livros carregados:", data);
            const lista = document.getElementById("lista");
            
            if (!data || data.length === 0) {
                lista.innerHTML = '<div class="lista-vazia"><p>Nenhum livro cadastrado. <a href="/livros/novo">Adicione o primeiro!</a></p></div>';
                return;
            }
            
            data.forEach(livro => {
                const card = document.createElement("div");
                card.className = "livro-card";
                card.innerHTML = `
                    <div class="livro-info">
                        <h3>${livro.titulo}</h3>
                        <p><strong>Autor:</strong> ${livro.autor}</p>
                        <p><strong>ISBN:</strong> ${livro.isbn}</p>
                        <p><strong>Ano:</strong> ${livro.anoPublicacao}</p>
                    </div>
                    <div class="botoes">
                        <button class="btn-editar" onclick="editarLivro('${livro.id}')">Editar</button>
                        <button class="btn-deletar" onclick="deletarLivro('${livro.id}')">Deletar</button>
                    </div>
                `;
                lista.appendChild(card);
            });
        })
        .catch(err => {
            console.error("Erro ao carregar livros:", err);
            document.getElementById("lista").innerHTML = '<div class="lista-vazia">Erro ao carregar livros</div>';
        });
    
    function deletarLivro(id) {
        if (confirm("Tem certeza que deseja deletar este livro?")) {
            fetch(`/api/livros/${id}`, {
                method: "DELETE",
                headers: {
                    "X-Usuario-Id": usuarioId
                }
            })
            .then(() => {
                window.location.reload();
            })
            .catch(err => alert("Erro ao deletar livro"));
        }
    }
    
    function editarLivro(id) {
        window.location.href = `/livros/editar/${id}`;
    }
</script>
</body>
</html>
