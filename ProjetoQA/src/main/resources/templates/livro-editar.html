<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="_csrf"        th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Biblioteca — Editar Livro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/livro-editar_styles.css}">
</head>

<body>

    <div class="page">

        <!-- HEADER -->
        <header class="header">

            <div class="header-brand">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                    stroke-linejoin="round">

                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                    <line x1="10" y1="7" x2="16" y2="7" />
                    <line x1="10" y1="11" x2="16" y2="11" />
                    <line x1="10" y1="15" x2="13" y2="15" />

                </svg>

                <div>
                    <h1>Editar Livro</h1>
                    <p>Atualize as informações do livro</p>
                </div>

            </div>

        </header>

        <!-- FORM -->
        <div class="form-card">

            <div id="erro" class="erro"></div>

            <form id="formLivro">

                <input type="hidden" id="id" th:value="${livro.id}">

                <div class="form-group">
                    <label for="titulo">Título *</label>

                    <input type="text" id="titulo" placeholder="Digite o título do livro" th:value="${livro.titulo}"
                        required>
                </div>

                <div class="form-group">
                    <label for="autor">Autor *</label>

                    <input type="text" id="autor" placeholder="Digite o nome do autor" th:value="${livro.autor}"
                        required>
                </div>

                <div class="form-group">
                    <label for="isbn">ISBN</label>

                    <input type="text" id="isbn" placeholder="Digite o ISBN" th:value="${livro.isbn}">
                </div>
                <div class="form-group">
                    <label for="ano">Ano de Publicação *</label>

                    <input type="number" id="ano" placeholder="2026" th:value="${livro.anoPublicacao}" required>
                </div>

                <div class="botoes">

                    <button type="submit" class="btn btn-primary">
                        Atualizar Livro
                    </button>

                    <button type="button" class="btn btn-secondary" onclick="window.location.href='/livros'">
                        Cancelar
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script th:inline="javascript">
        const usuarioId = "[[${usuarioId}]]";
    </script>

    <script th:src="@{/livro-editar_script.js}"></script>

</body>

</html>
