<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Biblioteca — Cadastro</title>

    <!-- FONT -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
          th:href="@{/cadastro_styles.css}"
          href="/cadastro_styles.css">
</head>

<body>

<div class="page">

<!-- PAINEL ESQUERDO -->
<div class="left-panel">

    <div class="left-content">

        <img th:src="@{/images/logo.png}"
             src="/images/logo.png"
             alt="EX LIBRIS"
             class="left-logo">

        <div class="left-overlay">

            <h2>Biblioteca Digital</h2>

            <p>
                Conectando leitores aos melhores livros
            </p>

        </div>

    </div>

</div>

    <!-- PAINEL DIREITO -->
    <section class="right-panel">

        <div class="container">

            <!-- MARCA -->
            <div class="brand">

                <h1>EX LIBRIS</h1>

                <p>
                    Crie sua conta para começar
                </p>

            </div>

            <!-- HEADER -->
            <div class="card">

                <!-- HEADER -->
                <div class="card-header">

                    <h2>Criar Conta</h2>

                    <span>
                        Preencha os dados abaixo
                    </span>

                </div>

                <!-- ERRO -->
                <div id="error"
                     class="error">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <circle cx="12"
                                cy="12"
                                r="10"></circle>

                        <line x1="12"
                              y1="8"
                              x2="12"
                              y2="12"></line>

                        <line x1="12"
                              y1="16"
                              x2="12.01"
                              y2="16"></line>

                    </svg>

                    <span id="error-text"></span>

                </div>

                <!-- FORM -->
                <form method="post" th:action="@{/cadastro}">

                    <!-- NOME -->
                    <div class="form-group">

                        <label for="nome">
                            Nome
                        </label>

                        <div class="input-wrapper">

                            <svg viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 stroke-linecap="round"
                                 stroke-linejoin="round">

                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>

                                <circle cx="12"
                                        cy="7"
                                        r="4"></circle>

                            </svg>

                            <input type="text"
                                   id="nome"
                                   name="nome"
                                   placeholder="Digite seu nome"
                                   autocomplete="name"
                                   required>

                        </div>

                    </div>

                    <!-- EMAIL -->
                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <div class="input-wrapper">

                            <svg viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 stroke-linecap="round"
                                 stroke-linejoin="round">

                                <path d="M4 4h16v16H4z"></path>

                                <polyline points="22,6 12,13 2,6"></polyline>

                            </svg>

                            <input type="email"
                                   id="email"
                                   name="email"
                                   placeholder="Digite seu email"
                                   autocomplete="email"
                                   required>

                        </div>

                    </div>

                    <!-- SENHA -->
                    <div class="form-group">

                        <label for="senha">
                            Senha
                        </label>

                        <div class="input-wrapper">

                            <svg viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 stroke-linecap="round"
                                 stroke-linejoin="round">

                                <rect x="3"
                                      y="11"
                                      width="18"
                                      height="11"
                                      rx="2"
                                      ry="2"></rect>

                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>

                            </svg>

                            <input type="password"
                                   id="senha"
                                   name="senha"
                                   placeholder="Digite sua senha"
                                   autocomplete="new-password"
                                   required>

                        </div>

                    </div>

                    <!-- BOTÃO -->
                    <button type="submit"
                            class="btn-primary">

                        <span class="btn-text">
                            Criar Conta
                        </span>

                        <span class="spinner"></span>

                    </button>

                </form>

            </div>

            <!-- FOOTER -->
            <div class="footer">

                <p>
                    Já possui conta?

                    <a th:href="@{/login}"
                       href="/login">

                        Fazer login

                    </a>
                </p>

            </div>

        </div>

    </section>

</div>

<!-- JS -->
<script th:src="@{/cadastro_script.js}"
        src="/cadastro_script.js"></script>

</body>
</html>
