name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'oracle'
          cache: maven

      - name: Build project
        run: ./mvnw clean compile -q

      - name: Run tests with coverage
        run: ./mvnw clean test jacoco:report -q

      - name: Generate JaCoCo coverage report
        run: ./mvnw jacoco:report -q

      - name: Upload coverage to SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.projectKey=Bloodborne2_ProjetoQA \
            -Dsonar.organization=bloodborne2 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -q

      - name: Verify coverage threshold
        run: ./mvnw jacoco:check -q

      - name: Generate test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: target/surefire-reports/TEST-*.xml
          reporter: 'java-junit'
          fail-on-error: false

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const jacocoReport = fs.readFileSync('target/site/jacoco/index.html', 'utf8');
            const coverageMatch = jacocoReport.match(/Total.*?<td.*?>(\d+%)<\/td>/);
            const coverage = coverageMatch ? coverageMatch[1] : 'N/A';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📊 **Code Coverage Report**\n\nTotal Coverage: ${coverage}\n\n✅ Tests: All tests passed\n\nView detailed report in artifacts.`
            });
